<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/style.css">


<style>
  .btn-tv {
    background: green;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 8px;
  }

  .btn-tv:hover{
    background: green;
  }
  .btn-abrir-tv{
    background: blue;
  }
  .consultorio-input{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    background: white;
    padding: 10px 14px;
    border-radius: 6px;
    border: 1px solid white;

  }

  .consultorio-input label{
    font-weight: bold;
  }
  .consultorio-input input{
    width: 60px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border: 1px solid white;
    border-radius: 4px
  }

</style>
</head>

<body>

<div class="Container">

 <div style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    ">
        <h2 style="margin: 0;">🏥 Triagem Hospitalar</h2>

        <button
            class="btn-abrir-tv"
            onclick="window.open('tv.html', '_blank')">
            Abrir Tela Da TV
        </button>
    </div>

<div class="consultorio-input">
  <label> Meu Consultorio:</label>
 <input type="text" id="consultorio-num" value="01">
 <span style="color: darkgrey; 
 font-size: 13px;">Este numero sera exebido na TV ao chamar o paciente,
 </span>
</div>



  <h2>🩺 Painel Médico</h2>

  <div id="triagens"></div>

  <hr>

  <h3>Consulta</h3>

  <input id="paciente" placeholder="Paciente" readonly>

  <input id="diagnostico" placeholder="Diagnóstico">

  <select id="medicacao">
    <option value="">Selecione a medicação</option>
  </select>

  <textarea id="obs" placeholder="Observações"></textarea>

  <button onclick="salvar()">Salvar</button>

</div>

<script>

let triagensCarregadas = [];

function carregar() {
  fetch("/triagens")
    .then(r => r.json())
    .then(data => {
      triagensCarregadas = data;

      const div = document.getElementById("triagens");
      div.innerHTML = "";

      data.forEach((t, index) => {
        div.innerHTML += `
          <div class="card">
            <h3>${t.nome}</h3>

            <p><b>Sintoma:</b> ${t.sintoma || "Não informado"}</p>

            <p><b>Temperatura:</b> ${t.temperatura || "Não informada"}°C</p>

            <p>
              <span class="${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p><b>Alergia:</b> ${t.alergia || "Nenhuma"}</p>

            <p><b>Observação:</b> ${t.observacao || "Nenhuma"}</p>

            <button onclick="selecionar(${index})">
              Atender
            </button>
          </div>
        `;
      });
    });
}

function selecionar(index) {
  const t = triagensCarregadas[index];

  document.getElementById("paciente").value = t.nome;
  document.getElementById("obs").value = t.observacao || "";

  if (t.alergia && t.alergia !== "Nenhuma") {
    alert("⚠️ Paciente possui alergia: " + t.alergia);
  }
}

function carregarMedicacoes() {
  fetch("/lista-medicacoes")
    .then(r => r.json())
    .then(data => {
      const select = document.getElementById("medicacao");

      select.innerHTML = `
        <option value="">Selecione a medicação</option>
      `;

      data.forEach(med => {
        const option = document.createElement("option");
        option.value = med;
        option.textContent = med;
        select.appendChild(option);
      });
    });
}

function salvar() {
  const paciente = document.getElementById("paciente").value;
  const diagnostico = document.getElementById("diagnostico").value;
  const medicacao = document.getElementById("medicacao").value;
  const obs = document.getElementById("obs").value;

  if (!paciente) {
    alert("Selecione um paciente clicando em Atender.");
    return;
  }

  if (!medicacao) {
    alert("Selecione uma medicação.");
    return;
  }

  fetch("/consulta", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      paciente,
      diagnostico,
      medicacao,
      obs
    })
  })
  .then(r => r.json())
  .then(() => {
    alert("Consulta salva");

    document.getElementById("diagnostico").value = "";
    document.getElementById("medicacao").value = "";
    document.getElementById("obs").value = "";
  });
}

carregar();
carregarMedicacoes();

</script>

</body>
</html>
